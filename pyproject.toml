[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kxt"
version = "0.1.0a2"
description = "Async Python client for Korean exchange (KRX) stocks, futures, and options via KIS"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "pumpkinredbean", email = "246057494+pumpkinredbean@users.noreply.github.com" },
]
keywords = [
  "korea",
  "krx",
  "securities",
  "market-data",
  "trading",
  "kis",
  "async",
  "futures",
  "options",
  "derivatives",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Framework :: AsyncIO",
  "Topic :: Office/Business :: Financial :: Investment",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "websockets>=12,<16",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.26",
  "pymdown-extensions>=10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/pumpkinredbean/kxt"
Repository = "https://github.com/pumpkinredbean/kxt"
"Bug Tracker" = "https://github.com/pumpkinredbean/kxt/issues"
Changelog = "https://github.com/pumpkinredbean/kxt/releases"

[project.scripts]
kxt = "kxt.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
